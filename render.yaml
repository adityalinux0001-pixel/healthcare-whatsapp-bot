databases:
  - name: healthbot-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

envVarGroups:
  - name: healthbot-secrets
    envVars:
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_HISTORY_TURNS
        value: "10"
      - key: SESSION_GAP_SECONDS
        value: "21600"
      - key: PREMIUM_PLAN_AMOUNT_RUPEES
        value: "499"
      - key: PREMIUM_PLAN_DAYS
        value: "21"
      - key: QUEUE_BACKEND
        value: kafka
      - key: KAFKA_NUM_PARTITIONS
        value: "6"
      - key: KAFKA_WORKER_MAX_CONCURRENT
        value: "6"

services:
  # ---- Managed Redis (Render Key Value) ----
  - type: keyvalue
    name: healthbot-redis
    plan: starter
    ipAllowList: []          # private network only, no public access
    maxmemoryPolicy: noeviction

  # ---- Self-hosted Kafka (single-broker KRaft mode) ----
  - type: pserv
    name: healthbot-kafka
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/confluentinc/cp-kafka:7.6.1
    disk:
      name: kafka-data
      mountPath: /var/lib/kafka/data
      sizeGB: 10
    envVars:
      - key: KAFKA_NODE_ID
        value: "1"
      - key: KAFKA_PROCESS_ROLES
        value: broker,controller
      - key: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: "1@localhost:9093"
      - key: KAFKA_LISTENERS
        value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      # Self-reference: Render injects this service's own stable
      # internal host:port so other services can resolve it correctly.
      - key: KAFKA_ADVERTISED_LISTENERS
        fromService:
          type: pserv
          name: healthbot-kafka
          property: hostport
        # value shape becomes e.g. "healthbot-kafka-xxxx:9092" — Kafka
        # needs the PLAINTEXT:// scheme prefix added; see deployment
        # notes below for the one manual edit this requires.
      - key: KAFKA_CONTROLLER_LISTENER_NAMES
        value: CONTROLLER
      - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      - key: KAFKA_INTER_BROKER_LISTENER_NAME
        value: PLAINTEXT
      - key: CLUSTER_ID
        value: "YLnj4tsXRAmRERgTDjIoVA"
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_AUTO_CREATE_TOPICS_ENABLE
        value: "true"

  # ---- Web service: FastAPI webhook receiver ----
  - type: web
    name: healthbot-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: healthbot-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: healthbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthbot-redis
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: healthbot-kafka
          property: hostport
      - key: BIND
        value: "0.0.0.0:10000"
      - key: WEB_CONCURRENCY
        value: "8"
      - key: DB_POOL_MIN_SIZE
        value: "2"
      - key: DB_POOL_MAX_SIZE
        value: "8"

  # ---- Inbound Kafka worker(s) ----
  - type: worker
    name: healthbot-inbound-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.workers.worker
    disk:
      name: audio-storage
      mountPath: /app/audio_storage
      sizeGB: 5
    envVars:
      - fromGroup: healthbot-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: healthbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthbot-redis
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: healthbot-kafka
          property: hostport

  # ---- Outbound Kafka worker ----
  - type: worker
    name: healthbot-outbound-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.workers.outbound_worker
    envVars:
      - fromGroup: healthbot-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: healthbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthbot-redis
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: healthbot-kafka
          property: hostport

  # ---- Dead-letter replay worker ----
  - type: worker
    name: healthbot-dead-letter-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.workers.dead_letter_worker
    envVars:
      - fromGroup: healthbot-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: healthbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthbot-redis
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: healthbot-kafka
          property: hostport

  # ---- Daily premium check-in (cron, runs once/day) ----
  - type: cron
    name: healthbot-daily-checkin
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.services.daily_checkin --once
    schedule: "0 9 * * *"
    envVars:
      - fromGroup: healthbot-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: healthbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthbot-redis
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: healthbot-kafka
          property: hostport