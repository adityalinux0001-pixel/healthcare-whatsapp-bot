services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsapp_bot
      POSTGRES_PASSWORD: whatsapp_bot
      POSTGRES_DB: whatsapp_bot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_bot -d whatsapp_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

kafka:
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  ports:
    - "9092:9092"

  environment:
    KAFKA_NODE_ID: 1
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

    CLUSTER_ID: "YLnj4tsXRAmRERgTDjIoVA"

    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  volumes:
    - kafka_data:/var/lib/kafka/data

  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 30s

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://whatsapp_bot:whatsapp_bot@db:5432/whatsapp_bot
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: "${QUEUE_BACKEND:-rq}"
      QUEUE_NAME: "${QUEUE_NAME:-default}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-8}"
      DB_POOL_MIN_SIZE: "${DB_POOL_MIN_SIZE:-2}"
      DB_POOL_MAX_SIZE: "${DB_POOL_MAX_SIZE:-8}"
    command: ["./start.sh", "${WEB_CONCURRENCY:-8}"]
    expose:
      - "8000"
    volumes:
      - audio_storage:/app/audio_storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    restart: unless-stopped
    deploy:
      replicas: 4
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://whatsapp_bot:whatsapp_bot@db:5432/whatsapp_bot
      QUEUE_BACKEND: "${QUEUE_BACKEND:-rq}"
      QUEUE_NAME: "${QUEUE_NAME:-default}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    command: ["python", "-m", "app.workers.worker"]
    volumes:
      - audio_storage:/app/audio_storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  outbound_worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://whatsapp_bot:whatsapp_bot@db:5432/whatsapp_bot
      QUEUE_BACKEND: "${QUEUE_BACKEND:-rq}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    command: ["python", "-m", "app.workers.outbound_worker"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  dead_letter_worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://whatsapp_bot:whatsapp_bot@db:5432/whatsapp_bot
      QUEUE_BACKEND: "${QUEUE_BACKEND:-rq}"
      QUEUE_NAME: "${QUEUE_NAME:-default}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    command: ["python", "-m", "app.workers.dead_letter_worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  daily_checkin:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://whatsapp_bot:whatsapp_bot@db:5432/whatsapp_bot

    command: ["python", "-m", "app.services.daily_checkin"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pg_data:
  redis_data:
  audio_storage:
  kafka_data:
